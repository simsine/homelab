name: Deploy
run-name: Deploy Ansible configuration

on:
  workflow_dispatch:

jobs:
  run_tests:
    name: Run tests
    uses: ./.github/workflows/tests.yml
  deploy_config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    needs: [ Tests ]
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          statedir: /tmp/tailscale-state/
          args: --login-server ${{ secrets.TS_LOGIN_SERVER}}
          authkey: ${{ secrets.TS_PREAUTH_KEY}}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.ANSIBLE_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}


      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Write ansible sudo password file
        run: printf '%s' '${{ secrets.ANSIBLE_SUDO_PASSWORD }}' > ./ansible/.sudo_password

      - name: Run ansible config
        run: bash ./run_config.sh
