name: Run Ansible tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  test_ansible:
    name: Test Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Test syntax of Ansible playbooks
        run: ansible-playbook -i ./ansible/hosts.ini --syntax-check ./ansible/*.yml

      - name: Test syntax of Ansible roles
        run: ansible-playbook -i ./ansible/hosts.ini --syntax-check ./ansible/*.yml

      - name: Lint all Ansible files
        run: ansible-lint ./ansible

