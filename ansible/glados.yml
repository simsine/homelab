---
- name: Glados config
  hosts:
    - glados

  tasks:
    - name: Write motd
      ansible.builtin.template:
        src: templates/glados/motd
        dest: /etc/motd
        mode: "0644"
      become: true

    - name: Write Yatzy service
      ansible.builtin.template:
        src: templates/glados/yatzy.service
        dest: /etc/systemd/system/yatzy.service
        mode: "0644"
      become: true
    - name: Write Yatzy socket
      ansible.builtin.template:
        src: templates/glados/yatzy.socket
        dest: /etc/systemd/system/yatzy.socket
        mode: "0644"
      become: true
    - name: Yatzy service
      ansible.builtin.systemd_service:
        name: yatzy
        enabled: true
      become: true
    - name: Yatzy socket
      ansible.builtin.systemd_service:
        name: yatzy
        enabled: true
      become: true

    - name: Caddy service
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true
        state: started
      become: true
    - name: Write Caddy config
      ansible.builtin.template:
        src: templates/glados/Caddyfile
        dest: /etc/caddy/Caddyfile
        mode: "0644"
      become: true
      notify: Restart Caddy

    - name: HAProxy service
      ansible.builtin.systemd_service:
        name: haproxy
        enabled: false
        state: stopped
      become: true
    - name: Write HAProxy config
      ansible.builtin.template:
        src: templates/glados/haproxy.cfg
        dest: /etc/haproxy/haproxy.cfg
        mode: "0644"
      become: true
      notify: Restart HAProxy

    - name: Headscale service
      ansible.builtin.systemd_service:
        name: headscale
        enabled: true
        state: started
      become: true
    - name: Write Headscale config
      ansible.builtin.template:
        src: templates/glados/headscale.config.yaml
        dest: /etc/headscale/config.yaml
        mode: "0644"
      become: true
      notify: Restart HAProxy

  handlers:
    - name: Restart Yatzy
      ansible.builtin.systemd_service:
        name: caddy
        state: restarted
      become: true

    - name: Restart Caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: restarted
      become: true

    - name: Restart HAProxy
      ansible.builtin.systemd_service:
        name: haproxy
        state: restarted
      become: true

    - name: Restart Headscale
      ansible.builtin.systemd_service:
        name: headscale
        state: restarted
      become: true
