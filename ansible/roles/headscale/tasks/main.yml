- name: Write Headscale config
  ansible.builtin.template:
    src: templates/config.yaml
    dest: /etc/headscale/config.yaml
    mode: "0644"
  become: true
  notify: Restart headscale

- name: Headscale service
  ansible.builtin.systemd_service:
    name: headscale
    enabled: true
    state: started
  become: true
