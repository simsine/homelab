load_module modules/ngx_http_acme_module.so;

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    # tcp_nopush on;
    gzip  on;

    resolver 1.1.1.1;

    acme_issuer letsencrypt {
        uri        https://acme-v02.api.letsencrypt.org/directory;
        # contact    admin@example.test;
        state_path /var/cache/nginx/acme-letsencrypt;

        accept_terms_of_service;
    }

    ### For WebSocket upgrades
    map $http_upgrade $connection_upgrade {
        default     keep-alive;
        'websocket' upgrade;
        ''          close;
    }

    ### General listener on port 80 is required to process ACME HTTP-01 challenges
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        ### Redirect to https
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name bupie.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        root /var/www/html/bupie;

        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name aperture.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        default_type text/plain;

        return 200 "Hello from Aperture Science Home Laboratories!";
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name headscale.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $server_name;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name uptime.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://localhost:3001;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name yatzy.simsine.no;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://localhost:8008;
        }
    }

    #include /etc/nginx/conf.d/*.conf;

    ### Fallback listener on port 443
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        server_name _;

        ### SSL
        acme_certificate      letsencrypt;
        ssl_certificate       $acme_certificate;
        ssl_certificate_key   $acme_certificate_key;
        ssl_certificate_cache max=2;

        location / {
            return 404;
        }
    }
}
