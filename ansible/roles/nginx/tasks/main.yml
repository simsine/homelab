- name: Install required nginx packages
  ansible.builtin.apt:
    pkg:
      - curl
      - gnupg2
      - ca-certificates
      - lsb-release
      - ubuntu-keyring
      - nginx
      - nginx-module-acme

- name: Write nginx config
  ansible.builtin.template:
    src: templates/nginx.conf
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    validate: /usr/sbin/nginx -t %s
  notify: Restart nginx
  become: true

- name: Nginx service
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
  become: true
