- name: Write HAProxy config
  ansible.builtin.template:
    src: templates/haproxy.cfg
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
  become: true
  notify: Restart HAProxy

- name: HAProxy service
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: false
    state: stopped
  become: true
