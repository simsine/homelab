services:
  mc:
    image: itzg/minecraft-server:java17
    restart: on-failure
    stop_grace_period: 1m
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: FORGE
      VERSION: 1.20.1
      FORGE_VERSION: 47.3.0
      MAX_MEMORY: 6G
      USE_AIKAR_FLAGS: true
      ENABLE_RCON: "true"
      VIEW_DISTANCE: 7
      TZ: CET
      MOTD: "Stay gloopy"
      ALLOW_FLIGHT: "TRUE"
      SERVER_NAME: "Bupie's Garden"
      ICON: /data/bupie.jpg
      SEED: -2992576055058289453
      SPAWN_PROTECTION: 0
      ENABLE_WHITELIST: true
      WHITELIST: |
        XPhaze_
        Coymo_
        BonBoNya
        Lixirixi
        Ace_Primera
        Froggy_Senpai
        HowToLive
        Mazercise
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - ./data:/data
 # "init" container for mc to restore the data volume when empty
  restore-backup:
    # Same image as mc, but any base image with bash and tar will work
    image: itzg/mc-backup
    #user: "1000"
    restart: no
    entrypoint: restore-rsync-backup
    volumes:
      # Must be same mount as mc service, needs to be writable
      - ./data:/data
      # Must be same mount as backups service, but can be read-only
      - ./backups:/backups:ro
  backups:
    image: itzg/mc-backup
    #user: "1000"
    depends_on:
      mc:
        condition: service_healthy
    environment:
      BACKUP_METHOD: rsync
      BACKUP_INTERVAL: "1d"
      PRUNE_BACKUPS_DAYS: 5
      RCON_HOST: mc
      # since this service waits for mc to be healthy, no initial delay is needed
      INITIAL_DELAY: 0
      # Backup only the world data:
      INCLUDES: world
    volumes:
      - ./data:/data:ro
      - ./backups:/backups