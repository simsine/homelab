services:
  mc:
    image: itzg/minecraft-server:java17
    restart: on-failure:3
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: FORGE
      VERSION: 1.20.1
      FORGE_VERSION: 47.3.0
      MAX_MEMORY: 8G
      USE_AIKAR_FLAGS: true
      VIEW_DISTANCE: 7
      TZ: CET
      MOTD: "Stay gloopy"
      ALLOW_FLIGHT: "TRUE"
      SERVER_NAME: "Bupie's Garden"
      ICON: /data/bupie.jpg
      SEED: -2992576055058289453
      SPAWN_PROTECTION: 0
      ENABLE_WHITELIST: true
      WHITELIST: |
        XPhaze_
        Coymo_
        BonBoNya
        Lixirixi
        Ace_Primera
        Froggy_Senpai
        HowToLive
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - ./data:/data