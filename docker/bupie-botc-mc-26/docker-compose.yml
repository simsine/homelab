services:
  mc:
    image: itzg/minecraft-server:java21
    restart: on-failure
    stop_grace_period: 1m
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "24454:24454/udp"
    environment:
      EULA: "TRUE"
      VERSION: 1.21.1
      TYPE: FABRIC
      FABRIC_LOADER_VERSION: 0.16.10
      USE_AIKAR_FLAGS: true
      VIEW_DISTANCE: 7
      MAX_MEMORY: 6G
      ENABLE_RCON: "true"
      TZ: CET
      SERVER_NAME: "Bupie's Garden"
      MOTD: "Bupie on the Clocktower"
      ICON: /data/bupie.jpg
      ALLOW_FLIGHT: "TRUE"
      SPAWN_PROTECTION: 0
      ENABLE_WHITELIST: true
      ENABLE_COMMAND_BLOCK: true
      MODE: "adventure"
      PVP: false
      DIFFICULTY: peaceful
      WHITELIST: |
        XPhaze_
        Coymo_
        BonBoNya
        Lixirixi
        Ace_Primera
        Froggy_Senpai
        HowToLive
        Mazercise
        PotatoFr1es
        kriz9K
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - ./data:/data:Z