services:
  mc:
    image: itzg/minecraft-server:java25
    restart: on-failure
    stop_grace_period: 1m
    tty: true
    stdin_open: true
    ports:
      - "25565:25565" # Minecraft server
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      TYPE: "VANILLA"
      USE_AIKAR_FLAGS: true
      VIEW_DISTANCE: 7
      MAX_MEMORY: 6G
      ENABLE_RCON: "true"
      TZ: CET
      SERVER_NAME: "Bæsj Garden"
      MOTD: "Bæsjesuppe"
      ALLOW_FLIGHT: "TRUE"
      SPAWN_PROTECTION: 0
      ENABLE_COMMAND_BLOCK: false
      MODE: "survival"
      PVP: true
      DIFFICULTY: "normal"
      ENABLE_WHITELIST: true
      WHITELIST: |
        XPhaze_
        PotatoFr1es
    volumes:
      - /srv/reg-vanilla-mc-26/data:/data:Z
